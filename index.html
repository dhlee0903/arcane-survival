<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>먼 곳의 횃대 · Distant Roost</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="repo" id="repo" href="https://github.com/dhlee0903/arcane-survival" target="_blank" rel="noopener">GitHub</a>

  <div class="wrap">
    <div class="board-wrap">
      <canvas id="board"></canvas>

      <button class="gear" id="gear" aria-label="일시정지 · 설정">
        <svg viewBox="0 0 16 16" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true">
          <mask id="gearMask">
            <rect width="16" height="16" fill="#000"/>
            <g fill="#fff">
              <rect x="6" y="0" width="4" height="16"/>
              <rect x="0" y="6" width="16" height="4"/>
              <rect x="3" y="3" width="10" height="10"/>
              <rect x="2" y="2" width="3" height="3"/><rect x="11" y="2" width="3" height="3"/>
              <rect x="2" y="11" width="3" height="3"/><rect x="11" y="11" width="3" height="3"/>
            </g>
            <rect x="6" y="6" width="4" height="4" fill="#000"/>
          </mask>
          <rect width="16" height="16" fill="currentColor" mask="url(#gearMask)"/>
        </svg>
      </button>

      <div class="banner" id="banner"></div>

      <div class="overlay" id="overlay"></div>

      <div class="overlay levelup" id="levelup">
        <h2 id="luLevel">LEVEL UP</h2>
        <div class="cards" id="cards"></div>
        <p class="dim">하나를 고르면 이어서 진행된다</p>
      </div>

      <div class="overlay menu" id="pause">
        <h2>일시정지</h2>
        <div class="menu-list">
          <button class="btn" id="pResume">계속하기</button>
          <button class="btn ghost" id="pRestart">다시 시작</button>
        </div>
        <div class="recipes" id="recipes"></div>
        <p class="dim">대체 스킬 — 스킬을 Lv6까지 올리고 짝이 되는 아이템을 갖춘 뒤 상자를 열면 된다</p>
        <p class="dim">PC: Esc 또는 P로도 열고 닫는다</p>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
